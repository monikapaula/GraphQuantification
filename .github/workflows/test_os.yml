name: OS Compatibility Check
on: [push, pull_request] # Runs every time you sync your code

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest] # Tests Linux and Windows
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-2.6.0+cpu.html
          pip install -r requirements.txt
      - name: Run Smoke Test
        run: python train_classifier.py --datasets presidential_election --epochs 1